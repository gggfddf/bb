apiVersion: v1
kind: Service
metadata:
  name: trading-system-api
  namespace: trading-system
  labels:
    app: trading-system
    component: api
    version: v1.0.0
  annotations:
    description: "Trading System API Service"
    owner: "trading-team"
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
    - name: websocket
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: trading-system
    component: api
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: trading-system-database
  namespace: trading-system
  labels:
    app: trading-system
    component: database
    version: v1.0.0
  annotations:
    description: "Trading System Database Service"
    owner: "trading-team"
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: trading-system
    component: database
---
