apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-system-config
  namespace: trading-system
  labels:
    app: trading-system
    component: config
    version: v1.0.0
  annotations:
    description: "Trading System Configuration"
    owner: "trading-team"
data:
  # Application Configuration
  app_config.yaml: |
    app:
      name: "Trading System"
      version: "1.0.0"
      environment: "production"
      debug: false
      log_level: "INFO"
    
    server:
      host: "0.0.0.0"
      port: 8000
      workers: 4
      timeout: 30
    
    database:
      host: "trading-system-database"
      port: 5432
      name: "trading_system"
      pool_size: 20
      max_overflow: 30
    
    cache:
      host: "trading-system-redis"
      port: 6379
      db: 0
      max_connections: 50
    
    message_queue:
      host: "trading-system-message-queue"
      port: 5672
      username: "trading_user"
      virtual_host: "/trading"
    
    monitoring:
      enabled: true
      metrics_port: 9090
      health_check_interval: 30
    
    logging:
      level: "INFO"
      format: "json"
      output: "stdout"
      file_path: "/var/log/trading-system/app.log"
      max_size: "100MB"
      max_files: 10
    
    security:
      jwt_secret: "your-jwt-secret-here"
      jwt_expiry: 3600
      bcrypt_rounds: 12
      rate_limit: 1000
      cors_origins: ["*"]
    
    trading:
      default_currency: "USD"
      max_position_size: 1000000
      risk_limit: 0.02
      trading_hours:
        start: "09:30"
        end: "16:00"
        timezone: "America/New_York"
    
    api:
      version: "v1"
      base_path: "/api/v1"
      docs_enabled: true
      rate_limit_enabled: true
      cors_enabled: true
  
  # Environment-specific overrides
  production_config.yaml: |
    app:
      environment: "production"
      debug: false
      log_level: "WARNING"
    
    server:
      workers: 8
      timeout: 60
    
    database:
      pool_size: 50
      max_overflow: 100
    
    cache:
      max_connections: 100
    
    security:
      rate_limit: 5000
      cors_origins: ["https://trading.example.com"]
    
    monitoring:
      enabled: true
      alerting_enabled: true
  
  # Development configuration
  development_config.yaml: |
    app:
      environment: "development"
      debug: true
      log_level: "DEBUG"
    
    server:
      workers: 2
      timeout: 30
    
    database:
      pool_size: 10
      max_overflow: 20
    
    cache:
      max_connections: 20
    
    security:
      rate_limit: 10000
      cors_origins: ["*"]
    
    monitoring:
      enabled: true
      alerting_enabled: false
  
  # Staging configuration
  staging_config.yaml: |
    app:
      environment: "staging"
      debug: false
      log_level: "INFO"
    
    server:
      workers: 4
      timeout: 45
    
    database:
      pool_size: 30
      max_overflow: 50
    
    cache:
      max_connections: 50
    
    security:
      rate_limit: 2000
      cors_origins: ["https://staging.trading.example.com"]
    
    monitoring:
      enabled: true
      alerting_enabled: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-system-monitoring-config
  namespace: trading-system
  labels:
    app: trading-system
    component: monitoring
    version: v1.0.0
  annotations:
    description: "Trading System Monitoring Configuration"
    owner: "trading-team"
data:
  # Prometheus configuration
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      - "alert_rules.yml"
    
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - trading-system-monitoring:9093
    
    scrape_configs:
      - job_name: 'trading-system-api'
        static_configs:
          - targets: ['trading-system-api:9090']
        metrics_path: '/metrics'
        scrape_interval: 10s
      
      - job_name: 'trading-system-database'
        static_configs:
          - targets: ['trading-system-database:5432']
        scrape_interval: 30s
      
      - job_name: 'trading-system-cache'
        static_configs:
          - targets: ['trading-system-redis:6379']
        scrape_interval: 30s
      
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
  
  # Alert rules
  alert_rules.yml: |
    groups:
      - name: trading-system
        rules:
          - alert: HighCPUUsage
            expr: container_cpu_usage_seconds_total{container="trading-system-api"} > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage detected"
              description: "Container {{ $labels.container }} has high CPU usage"
          
          - alert: HighMemoryUsage
            expr: container_memory_usage_bytes{container="trading-system-api"} / container_spec_memory_limit_bytes{container="trading-system-api"} > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage detected"
              description: "Container {{ $labels.container }} has high memory usage"
          
          - alert: APIDown
            expr: up{job="trading-system-api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Trading System API is down"
              description: "The trading system API has been down for more than 1 minute"
          
          - alert: DatabaseConnectionError
            expr: pg_up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Database connection error"
              description: "Cannot connect to the database"
          
          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High error rate detected"
              description: "Error rate is above 5% for the last 5 minutes"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-system-logging-config
  namespace: trading-system
  labels:
    app: trading-system
    component: logging
    version: v1.0.0
  annotations:
    description: "Trading System Logging Configuration"
    owner: "trading-team"
data:
  # Fluentd configuration
  fluentd.conf: |
    <source>
      @type tail
      path /var/log/containers/*.log
      pos_file /var/log/fluentd-containers.log.pos
      tag kubernetes.*
      read_from_head true
      <parse>
        @type json
        time_format %Y-%m-%dT%H:%M:%S.%NZ
      </parse>
    </source>
    
    <filter kubernetes.**>
      @type kubernetes_metadata
      @id filter_kube_metadata
    </filter>
    
    <filter kubernetes.**>
      @type record_transformer
      enable_ruby true
      <record>
        app_name "#{ENV['APP_NAME'] || 'trading-system'}"
        environment "#{ENV['ENVIRONMENT'] || 'production'}"
      </record>
    </filter>
    
    <match kubernetes.**>
      @type elasticsearch
      host trading-system-logging
      port 9200
      logstash_format true
      logstash_prefix k8s
      <buffer>
        @type file
        path /var/log/fluentd-buffers/kubernetes.system.buffer
        flush_mode interval
        retry_type exponential_backoff
        flush_interval 5s
        retry_forever false
        retry_max_interval 30
        chunk_limit_size 2M
        queue_limit_length 8
        overflow_action block
      </buffer>
    </match>
  
  # Logstash configuration
  logstash.conf: |
    input {
      beats {
        port => 5044
      }
    }
    
    filter {
      if [kubernetes] {
        mutate {
          add_field => {
            "cluster_name" => "${CLUSTER_NAME}"
            "namespace" => "%{[kubernetes][namespace]}"
            "pod_name" => "%{[kubernetes][pod][name]}"
            "container_name" => "%{[kubernetes][container][name]}"
          }
        }
      }
      
      if [fields][service] == "trading-system-api" {
        grok {
          match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:message}" }
        }
      }
    }
    
    output {
      elasticsearch {
        hosts => ["trading-system-logging:9200"]
        index => "trading-system-%{+YYYY.MM.dd}"
      }
    }